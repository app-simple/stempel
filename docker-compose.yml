# Lokale Entwicklung: PostgreSQL und Mailpit. Ports über .env änderbar.
name: stempel

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asos-dev}
      POSTGRES_DB: ${POSTGRES_DB:-asos}
      TZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5442}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./tools/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1036}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8036}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
