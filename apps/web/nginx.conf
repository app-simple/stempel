# Angular production output uses eight-character uppercase content hashes.
# Keep all headers at server level so location blocks inherit security headers.
map $uri $asset_cache_control {
    default "no-cache";
    /index.html "no-store";
    ~*\.(?:html)$ "no-store";
    "~-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|avif|ico)$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
    add_header Cache-Control $asset_cache_control;
    # TLS ends at the ingress: configure Strict-Transport-Security there.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # The ingress must route /api and /api/* to the API service, preserving the path.
    location = /api {
        return 404;
    }
    location ^~ /api/ {
        return 404;
    }

    location = /index.html {
        try_files $uri =404;
    }
    location ~* \.(?:js|css|map|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
